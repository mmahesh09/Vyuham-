# Prometheus: metrics arrive from the Collector over OTLP (--web.enable-otlp-receiver).
# Retention is a command-line flag in docker-compose.prod.yml (PROM_RETENTION, default 90d).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

otlp:
  # Keep these resource attributes as labels, so dashboards can split by service, version and environment.
  promote_resource_attributes:
    - service.name
    - service.version
    - deployment.environment

storage:
  tsdb:
    out_of_order_time_window: 30m # batched OTLP data can arrive slightly out of order

scrape_configs:
  # The Collector's own health: accepted, refused and dropped data, queue sizes.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
