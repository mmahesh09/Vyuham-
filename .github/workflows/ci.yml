name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SCHEDULER_ENABLED: "false"
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://app:app@localhost:5432/app_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            my-deck/package-lock.json
      - run: npm ci
      - name: Build decks (open-slide, served at /decks)
        working-directory: my-deck
        run: npm ci && npm run build:app
      - run: npx tsc --noEmit -p .
      - run: npx eslint src
      - name: Production build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-used-at-runtime-0123456789
          NEXT_TELEMETRY_DISABLED: "1"
