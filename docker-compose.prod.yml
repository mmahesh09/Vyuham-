# Production on one VPS: the API, background jobs and Redis, behind Caddy (automatic HTTPS).
# Postgres is managed and shared with the Next.js app, which runs on Vercel. See DEPLOY.md.
#
#   cp deploy/.env.prod.example .env.prod      # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# The API and the worker share the `appdata` volume: uploaded datasets live there as Parquet files
# and both read them. Back it up (deploy/backup-data.sh); it's the only copy.
name: vyuham

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (managed Postgres) in .env.prod}
  DATA_DIR: /data
  REDIS_URL: redis://redis:6379/0
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  # The web app's public address: links in emails, and where reports are rendered (/internal/pdf).
  APP_URL: ${APP_URL:?set APP_URL (the Vercel address) in .env.prod}
  PRINT_BASE_URL: ${APP_URL}
  SIGNING_SECRET: ${SIGNING_SECRET:?set SIGNING_SECRET (32+ random characters) in .env.prod}
  CONNECTIONS_KEY: ${CONNECTIONS_KEY:?set CONNECTIONS_KEY (a Fernet key) in .env.prod}
  PUBLIC_EGRESS_IP: ${PUBLIC_EGRESS_IP:-}
  SUPPORT_STAFF_EMAILS: ${SUPPORT_STAFF_EMAILS:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  GLITCHTIP_WEBHOOK_SECRET: ${GLITCHTIP_WEBHOOK_SECRET:-}
  STATUS_API_URL: http://backend:8000
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-Vyuham <onboarding@resend.dev>}
  PDF_RENDERER: ${PDF_RENDERER:-forme}
  PDF_CHROMIUM_FALLBACK: ${PDF_CHROMIUM_FALLBACK:-true}
  REPORT_STORAGE: ${REPORT_STORAGE:-local}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  REACHER_URL: ${REACHER_URL:-}
  REACHER_SECRET: ${REACHER_SECRET:-}
  # Telemetry (app/telemetry.py): off while the endpoint is empty. With the observability profile running,
  # set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in .env.prod. See docs/observability.md.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_TIMEOUT: "5" # seconds for the Python exporter, per export attempt
  OTEL_SEMCONV_STABILITY_OPT_IN: http # current HTTP metric names (http.server.request.duration, in seconds)
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}

# The observability stack (profile "observability"): OpenTelemetry Collector -> Tempo (traces),
# Prometheus (metrics), Loki (logs) -> Grafana at https://$API_DOMAIN/grafana. Nothing here starts unless
# you pass --profile observability. Memory caps total about 1.9 GB; plan on an 8 GB server.
x-observability: &observability
  profiles: [observability]
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.8.4-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN (e.g. api.example.com) in .env.prod}
      # Checked by Caddy before /otel is forwarded (the Collector checks it again).
      OTEL_COLLECTOR_TOKEN: ${OTEL_COLLECTOR_TOKEN:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Job messages only; a lost queue is re-filled by the next tick, so no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Runs `alembic upgrade head` on start, then serves the API (only Caddy reaches it).
  backend:
    build: { context: ./backend, target: api }
    environment: *backend-env
    volumes: [appdata:/data]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  worker:
    build: { context: ./backend, target: worker }
    environment: *backend-env
    volumes: [appdata:/data]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # Queues a scheduler tick every minute. Exactly one beat.
  beat:
    build: { context: ./backend, target: api }
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # ---------- observability (profile "observability") ----------

  otel-collector:
    <<: *observability
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTEL_COLLECTOR_TOKEN: ${OTEL_COLLECTOR_TOKEN:-}
      OTEL_SAMPLE_PERCENT: ${OTEL_SAMPLE_PERCENT:-10}
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo, prometheus, loki]
    mem_limit: 256m

  tempo:
    <<: *observability
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-336h}
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    mem_limit: 512m

  prometheus:
    <<: *observability
    image: prom/prometheus:v3.4.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-90d}
      - --web.enable-otlp-receiver
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    mem_limit: 512m

  loki:
    <<: *observability
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-336h}
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    mem_limit: 384m

  # Served by Caddy at https://$API_DOMAIN/grafana. Refuses to start without an admin password, so it
  # can never come up with Grafana's default admin/admin.
  grafana:
    <<: *observability
    image: grafana/grafana-oss:12.0.2
    entrypoint: ["sh", "-c", 'if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then echo "Set GRAFANA_ADMIN_PASSWORD in .env.prod" >&2; exit 1; fi; exec /run.sh']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: https://${API_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - ./deploy/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/vyuham.yaml:ro
      - ./deploy/observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/vyuham.yaml:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards/vyuham:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]
    mem_limit: 256m

volumes:
  appdata:
  caddy_data:
  caddy_config:
  tempo_data:
  prom_data:
  loki_data:
  grafana_data:
