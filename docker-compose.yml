x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
  DATA_DIR: /data
  REDIS_URL: redis://redis:6379/0
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  APP_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  # Signs print-page and download links; must be the same for the API and the worker.
  SIGNING_SECRET: ${SIGNING_SECRET:-dev-only-signing-secret-change-me-0123456789}
  # The worker's browser opens the print page through the frontend container.
  PRINT_BASE_URL: http://frontend:3000
  # Status page: the beat pings the API so "API" is checked from outside it.
  STATUS_API_URL: http://backend:8000
  # Support staff (comma-separated emails): support inbox, help articles, incidents.
  SUPPORT_STAFF_EMAILS: ${SUPPORT_STAFF_EMAILS:-}
  # Error tracking: a DSN from GlitchTip (below) and the secret on its webhook URL. Off when empty.
  SENTRY_DSN: ${SENTRY_DSN:-}
  GLITCHTIP_WEBHOOK_SECRET: ${GLITCHTIP_WEBHOOK_SECRET:-}
  # Telemetry: off unless set. With `--profile observability`, use OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Job messages only; a lost queue is re-filled by the next tick, so no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  backend:
    build: { context: ./backend, target: api }
    environment: *backend-env
    volumes: [appdata:/data]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      start_period: 20s
      retries: 6

  # Runs background jobs and renders reports. Waits for the backend so migrations have been
  # applied; PDF reports also need the frontend (the print page).
  worker:
    build: { context: ./backend, target: worker }
    environment: *backend-env
    volumes: [appdata:/data]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }

  # Queues a scheduler tick every minute. Exactly one beat, however many workers.
  beat:
    build: { context: ./backend, target: api }
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }

  # Job queue dashboard; bound to localhost only.
  flower:
    build: { context: ./backend, target: api }
    command: ["celery", "-A", "app.worker", "flower", "--port=5555"]
    environment:
      <<: *backend-env
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:admin}
    ports: ["127.0.0.1:5555:5555"]
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      additional_contexts:
        decks: ./my-deck  # open-slide decks, served at /decks
    environment:
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql://app:app@db:5432/app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
    ports: ["3000:3000"]
    depends_on: [backend]

  # Local S3 (MiniStack) for trying REPORT_STORAGE=s3 without AWS. Dev only:
  #   docker compose --profile dev up s3
  # then S3_ENDPOINT_URL=http://localhost:4566, S3_ACCESS_KEY=test, S3_SECRET_KEY=test.
  s3:
    image: ministackorg/ministack:1.5.37
    profiles: ["dev"]
    ports: ["127.0.0.1:4566:4566"]

  # Error tracking: self-hosted GlitchTip (MIT), Sentry-SDK compatible. Optional:
  #   docker compose --profile errors up -d glitchtip
  # then open http://localhost:8001, create an org + project, copy its DSN into SENTRY_DSN /
  # NEXT_PUBLIC_SENTRY_DSN, and add a webhook alert to
  #   http://backend:8000/support/webhooks/glitchtip?secret=<GLITCHTIP_WEBHOOK_SECRET>
  glitchtip-db:
    image: postgres:18
    profiles: ["errors"]
    command: -c max_locks_per_transaction=512
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes: [glitchtip-pg:/var/lib/postgresql]

  glitchtip:
    image: glitchtip/glitchtip:6
    profiles: ["errors"]
    depends_on: [glitchtip-db]
    ports: ["127.0.0.1:8001:8000"]
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-db:5432/glitchtip
      VALKEY_URL: ""  # task queue and cache in Postgres; keeps it to one extra database
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-glitchtip-secret-change-me}
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-errors@localhost}
      SERVER_ROLE: all_in_one
      GLITCHTIP_ENABLE_UPTIME: "False"
    volumes: [glitchtip-uploads:/code/uploads]

  # Observability for local development: Grafana, Tempo, Prometheus, Loki and a Collector in one container
  # (grafana/otel-lgtm). Start with:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 docker compose --profile observability up
  # Grafana: http://localhost:3001 (admin / admin, local only). Production uses separate services instead
  # (docker-compose.prod.yml), with the privacy and sampling rules in deploy/otel-collector.yaml.
  lgtm:
    image: grafana/otel-lgtm:0.11.4
    profiles: ["observability"]
    ports: ["3001:3000", "4317:4317", "4318:4318"]

volumes:
  pgdata:
  appdata:
  glitchtip-pg:
  glitchtip-uploads:
