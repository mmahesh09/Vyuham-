x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
  DATA_DIR: /data
  REDIS_URL: redis://redis:6379/0
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  APP_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  RESEND_API_KEY: ${RESEND_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Job messages only; a lost queue is re-filled by the next tick, so no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment: *backend-env
    volumes: [appdata:/data]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      start_period: 20s
      retries: 6

  # Runs background jobs. Waits for the backend so migrations have been applied.
  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
    environment: *backend-env
    volumes: [appdata:/data]
    depends_on:
      backend: { condition: service_healthy }

  # Queues a scheduler tick every minute. Exactly one beat, however many workers.
  beat:
    build: ./backend
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }

  # Job queue dashboard; bound to localhost only.
  flower:
    build: ./backend
    command: ["celery", "-A", "app.worker", "flower", "--port=5555"]
    environment:
      <<: *backend-env
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:admin}
    ports: ["127.0.0.1:5555:5555"]
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql://app:app@db:5432/app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  appdata:
